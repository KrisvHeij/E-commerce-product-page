<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <title>Frontend Mentor | E-commerce product page</title>
  </head>
  <body>
    <div class="dark-bg visually-hidden" aria-hidden="true"></div>
    <div class="container">
      <header class="header-outer">
        <div class="header-left">
          <button
            id="nav-button"
            class="nav-button"
            type="button"
            aria-label="Open primary navigation"
            aria-haspopup="true"
            aria-controls="primary-nav"
            aria-expanded="false"
          >
            <img src="./images/icon-menu.svg" alt="" />
          </button>
          <a href="#"
            ><img class="logo" src="./images/logo.svg" alt="Sneakers"
          /></a>
          <nav>
            <ul
              id="primary-nav"
              class="primary-nav"
              aria-labelledby="nav-button"
            >
              <li><a href="#" class="nav-link">Collections</a></li>
              <li><a href="#" class="nav-link">Men</a></li>
              <li><a href="#" class="nav-link">Women</a></li>
              <li><a href="#" class="nav-link">About</a></li>
              <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
          </nav>
        </div>
        <div class="header-right">
          <button class="cart-icon">
            <img src="./images/icon-cart.svg" alt="" />
          </button>
          <a href="#" class="profile"
            ><img src="./images/image-avatar.png" alt=""
          /></a>
        </div>
      </header>
    </div>

    <!-- Collections
  Men
  Women
  About
  Contact

  Sneaker Company

  Fall Limited Edition Sneakers

  These low-profile sneakers are your perfect casual wear companion. Featuring a 
  durable rubber outer sole, they’ll withstand everything the weather can offer.

  $125.00
  50%
  $250.00

  0
  Add to cart -->
  </body>
</html>
